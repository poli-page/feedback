name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you're trying to accomplish first - the "why" matters more than the "what".

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "When working on long invoices, I lose track of where I am in the template..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the editor to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or thought about.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Mockups, links, references.
